<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Venda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">
	<div th:replace="~{fragments/appTopBar :: appTopBar}"></div>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white py-3">
                        <h4 class="mb-0">
                            <i class="bi bi-pencil-square me-2"></i>Editar Venda #<span th:text="${sale.idsale}">0</span>
                        </h4>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/sale/update}" th:object="${sale}" method="post">
                            
                            <input type="hidden" th:field="*{idsale}">
                            <input type="hidden" th:field="*{user}"> <input type="hidden" th:field="*{created_at}"> <div class="row g-3">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Cliente</label><br>
                                    <select class="form-select" disabled>
                                    	<option th:value="${customer.idcustomer}" th:text="${customer.name}" selected></option>
                                    </select>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Produto</label>
                                    <select class="form-select" disabled>
                                    	<option th:value="${product.idproduct}" th:text="${product.name + ' - ' + 'R$ ' + product.price}" selected></option>                                    
                                    </select>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Método de Pagamento</label>
                                    <select class="form-select" disabled>
                                    	<option th:value="${sale.paymentMethod}" th:text="${sale.paymentMethod.name == 'A_VISTA' ? 'Á VISTA' : sale.paymentMethod}"></option>
                                    </select>                                    
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Desconto (%)</label>
                                    <input type="number" class="form-control" th:value="${sale.off}" name="off" disabled/>
                                </div>

                                <div class="col-md-4 mb-3">
                                    <label class="form-label fw-bold">Status da Venda</label>
                                    <select class="form-select" th:field="*{status}">
                                        <option value="CONCLUIDA">CONCLUIDA</option>
                                        <option value="PENDENTE">PENDENTE</option>
                                        <option value="REPROVADA">REPROVADA</option>
                                    </select>
                                </div>
                            </div>

                            <div class="alert alert-info mt-3 py-2">
                                <i class="bi bi-info-circle me-2"></i>
                                Criado em: <span th:text="${#temporals.format(sale.created_at, 'dd/MM/yyyy HH:mm')}"></span>
                            </div>

                            <div class="d-flex justify-content-between border-top pt-3 mt-4">
                                <a th:href="@{/sales}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-5">
                                    <i class="bi bi-save me-1"></i> Atualizar Venda
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
