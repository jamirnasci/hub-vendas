<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div th:replace="~{fragments/appTopBar :: appTopBar}"></div>

    <div class="card shadow-sm border-0 m-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-primary"><i class="bi bi-cart-check me-2"></i>Histórico de Vendas</h4>
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalSale">
                <i class="bi bi-plus-lg me-1"></i> Nova Venda
            </button>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Data</th>
                            <th>Cliente</th>
                            <th>Produto</th>
                            <th>Desconto</th>
                            <th>Pagamento</th>
                            <th>Status</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${sales.isEmpty()}">
                            <td colspan="7" class="text-center py-4">Nenhuma venda registrada.</td>
                        </tr>
                        <tr th:each="s : ${sales}">
                            <td class="ps-4">
                                <small class="fw-bold"
                                    th:text="${#temporals.format(s.created_at, 'dd/MM/yyyy')}">01/01</small><br>
                                <small class="text-muted"
                                    th:text="${#temporals.format(s.created_at, 'HH:mm')}">12:00</small>
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${s.customer.name}">Nome Cliente</div>
                            </td>
                            <td>
                                <div th:text="${s.product.name}">Nome Produto</div>
                                <small class="text-muted" th:text="'Unit: R$ ' + ${s.product.price}">R$ 0</small>
                            </td>
                            <td th:text="${#numbers.formatDecimal(s.off, 1, 'POINT', 2, 'COMMA') + '%'}">0%</td>
                            <td>
                                <span class="badge rounded-pill bg-light text-dark border"
                                    th:text="${s.paymentMethod.name == 'A_VISTA' ? 'À VISTA' : s.paymentMethod.name}">PIX</span>
                            </td>
                            <td>
                                <span
                                    th:classappend="${s.status.name() == 'CONCLUIDA'} ? 'bg-success' : (${s.status.name() == 'PENDENTE'} ? 'bg-warning text-dark' : 'bg-danger')"
                                    class="badge" th:text="${s.status}">PENDENTE</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/sale/update/{id}(id=${s.idsale})}"
                                    class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>    

    <div class="modal fade" id="modalSale" tabindex="-1" aria-labelledby="modalSaleLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">

                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalSaleLabel">
                        <i class="bi bi-cart-check me-2"></i>Registrar Nova Venda
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>

                <form th:action="@{/sale/create}" method="post">
                    <div class="modal-body p-4">
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Cliente</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <select class="form-select" name="customer" required>
                                        <option value="" disabled selected>Selecione o cliente...</option>
                                        <option th:each="c : ${customers}" th:value="${c.idcustomer}"th:text="${c.name}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Produto</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-box"></i></span>
                                    <select class="form-select" name="product" required>
                                        <option value="" disabled selected>Selecione o produto...</option>
                                        <option th:each="p : ${products}" th:value="${p.idproduct}" th:text="${p.name + ' - R$ ' + p.price}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Forma de Pagamento</label>
                                <select class="form-select" name="paymentMethod" required>
                                    <option value="" disabled selected>Escolha o método...</option>
                                    <option value="A_VISTA">À VISTA</option>
                                    <option value="CONSORCIO">CONSÓRCIO</option>
                                    <option value="FINANCIAMENTO">FINANCIAMENTO</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold">Desconto (%)</label>
                                <div class="input-group">
                                    <input type="number" step="0.01" min="0" max="100" class="form-control" name="off"
                                        value="0">
                                    <span class="input-group-text">%</span>
                                </div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-bold">Status</label>
                                <select class="form-select" name="status">
                                    <option value="" disabled selected>Escolha o status...</option>
                                    <option value="CONCLUIDA">CONCLUÍDA</option>
                                    <option value="PENDENTE">PENDENTE</option>
                                    <option value="REPROVADA">REPROVADA</option>
                                </select>
                            </div>

                        </div>
                    </div>

                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                        <button type="submit" class="btn btn-success px-4">
                            <i class="bi bi-check2-circle me-1"></i> Finalizar Lançamento
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</body>

</html>
