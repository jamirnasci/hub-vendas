<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/errHandler.js}"></script>
    <script th:src="@{/js/productPagination.js}"></script>
</head>

<body>
    <div th:replace="~{fragments/appTopBar :: appTopBar}"></div>
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-primary"><i class="bi bi-list-ul me-2"></i>Lista de Produtos</h4>
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalProduto">
                <i class="bi bi-plus-lg me-1"></i> Novo Produto
            </button>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Imagem</th>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th class="text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                    	<p th:if="${products.isEmpty()}">Não há produtos para mostrar</p>
                        <tr th:each="p : ${products}">
                            <td class="ps-4">
                                <img th:src="${p.imgUrl != null && !p.imgUrl.isEmpty() ? p.imgUrl : 'https://via.placeholder.com/50'}"
                                    alt="Produto" class="rounded shadow-sm"
                                    style="width: 50px; height: 50px; object-fit: cover;">
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${p.name}">Nome do Produto</div>
                                <small class="text-muted" th:text="${#strings.abbreviate(p.description, 40)}">Descrição
                                    curta...</small>
                            </td>
                            <td class="fw-semibold"
                                th:text="${'R$ ' + #numbers.formatDecimal(p.price, 1, 'POINT', 2, 'COMMA')}">
                                R$ 0,00
                            </td>
                            <td>
                                <span th:class="${p.quantity < 5} ? 'badge bg-danger' : 'badge bg-info'"
                                    th:text="${p.quantity}">0</span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group btn-group-sm">
                                    <a th:href="@{/product/update/{id}(id=${p.idproduct})}" class="btn btn-outline-primary"
                                        title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button type="button" class="btn btn-outline-danger" title="Excluir"
                                        th:onclick="'confirmarExclusao(' + ${p.idproduct} + ')'">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            <div class="card-footer bg-white border-0 py-3">
                <div class="d-flex justify-content-center">
                    <button class="btn btn-sm btn-outline-secondary me-2" onclick="previousPage()"><i class="bi bi-chevron-left"></i></button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="nextPage()"><i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
            </div>
        </div>
    </div>

    <script>
        function confirmarExclusao(id) {
            if (confirm('Deseja realmente excluir este produto?')) {
                window.location.href = '/product/delete/' + id;
            }
        }
    </script>

    <!--modal cadastro-->

    <div class="modal fade" id="modalProduto" tabindex="-1" aria-labelledby="modalProdutoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="modalProdutoLabel">
                        <i class="bi bi-box-seam me-2"></i>Cadastrar Novo Produto
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>

                <form th:action="@{/product/create}" method="post">
                    <div class="modal-body p-4">
                        <div class="row">
                            <div class="col-12 mb-3">
                                <label class="form-label fw-bold">Nome do Produto</label>
                                <input type="text" class="form-control" name="name" placeholder="Ex: Monitor 24 pol"
                                    required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Preço</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" step="0.01" min="0" class="form-control" name="price"
                                        placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Quantidade</label>
                                <input type="number" min="0" class="form-control" name="quantity" placeholder="0"
                                    required>
                            </div>

                            <div class="col-12 mb-3">
                                <label class="form-label fw-bold">URL da Imagem</label>
                                <input type="text" class="form-control" name="imgUrl" placeholder="https://...">
                            </div>

                            <div class="col-12 mb-2">
                                <label class="form-label fw-bold">Descrição</label>
                                <textarea class="form-control" name="description" rows="3" required></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                        <button type="submit" class="btn btn-success px-4">Salvar Produto</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</body>

</html>
