<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Produto</title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Produto</h4>
        </div>

        <div class="card-body p-4">
            <form th:action="@{/product/update}" th:object="${product}" method="post">

                <input type="hidden" th:field="*{idproduct}">

                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">Nome do Produto</label>
                        <input type="text" class="form-control" th:field="*{name}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Preço (R$)</label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Quantidade em Estoque</label>
                        <input type="number" class="form-control" th:field="*{quantity}" required>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label fw-bold">URL da Imagem</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-image"></i></span>
                            <input type="text" class="form-control" th:field="*{imgUrl}">
                        </div>
                        <div class="mt-2">
                            <small class="text-muted d-block mb-1">Visualização atual:</small>
                            <img th:src="*{imgUrl}" class="img-thumbnail" style="height: 100px;" alt="Preview">
                        </div>
                    </div>

                    <div class="col-12 mb-4">
                        <label class="form-label fw-bold">Descrição</label>
                        <textarea class="form-control" th:field="*{description}" rows="4" required></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-between border-top pt-3">
                    <a th:href="@{/product}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Voltar
                    </a>
                    <button type="submit" class="btn btn-primary px-5">
                        Atualizar Dados
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
