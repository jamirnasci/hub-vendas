<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/errHandler.js}"></script>
    <script th:src="@{/js/customerPagination.js}"></script>
</head>

<body>
    <div th:replace="~{fragments/appTopBar :: appTopBar}"></div>
    
    <div class="container-fluid mt-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 text-primary"><i class="bi bi-people-fill me-2"></i>Gestão de Clientes</h4>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCustomer">
                    <i class="bi bi-person-plus-fill me-1"></i> Novo Cliente
                </button>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Nome / E-mail</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>Criado em</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${customers.isEmpty()}">
                                <td colspan="6" class="text-center py-4 text-muted">Nenhum cliente encontrado.</td>
                            </tr>
                            
                            <tr th:each="c : ${customers}">
                                <td class="ps-4 text-muted" th:text="${c.idcustomer}">1</td>
                                <td>
                                    <div class="fw-bold" th:text="${c.name}">Nome do Cliente</div>
                                    <small class="text-muted" th:text="${c.email}">email@exemplo.com</small>
                                </td>
                                <td th:text="${c.cpf}">000.000.000-00</td>
                                <td th:text="${c.phone}">(00) 00000-0000</td>
                                <td>
                                    <small th:text="${#temporals.format(c.created_at, 'dd/MM/yyyy HH:mm')}">01/01/2024</small>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/customer/update/{id}(id=${c.idcustomer})}" class="btn btn-outline-primary" title="Editar">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button" class="btn btn-outline-danger" title="Excluir"
                                            th:onclick="'confirmarExclusao(' + ${c.idcustomer} + ')'">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="card-footer bg-white border-0 py-3">
                <div class="d-flex justify-content-center">
                    <button class="btn btn-sm btn-outline-secondary me-2" onclick="previousPage()"><i class="bi bi-chevron-left"></i></button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="nextPage()"><i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalCustomer" tabindex="-1" aria-labelledby="modalCustomerLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalCustomerLabel">
                        <i class="bi bi-person-plus me-2"></i>Cadastrar Novo Cliente
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <form th:action="@{/customer/create}" method="post">
                    <div class="modal-body p-4">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-bold">Nome Completo</label>
                                <input type="text" class="form-control" name="name" placeholder="Ex: João Silva" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">CPF (Somente Números)</label>
                                <input type="text" class="form-control" name="cpf" placeholder="00000000000" required maxlength="11">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Telefone</label>
                                <input type="text" class="form-control" name="phone" placeholder="(00) 00000-0000" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">E-mail</label>
                                <input type="email" class="form-control" name="email" placeholder="joao@email.com" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label fw-bold">Observações / Descrição</label>
                                <textarea class="form-control" name="description" rows="3" placeholder="Informações adicionais sobre o cliente..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary px-4">Salvar Cliente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function confirmarExclusao(id) {
            if (confirm('Tem certeza que deseja remover este cliente? Esta ação não pode ser desfeita.')) {
                window.location.href = '/customer/delete/' + id;
            }
        }
    </script>
</body>
</html>
