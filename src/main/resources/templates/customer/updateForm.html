<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0"><i class="bi bi-person-gear me-2"></i>Editar Cliente</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/customer/update}" th:object="${customer}" method="post">

                            <input type="hidden" th:field="*{idcustomer}">
                            
                            <input type="hidden" th:field="*{created_at}">
                            <input type="hidden" th:field="*{user}">

                            <div class="row">
                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold">Nome Completo</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" th:field="*{name}" required>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">CPF</label>
                                    <input type="text" class="form-control" th:field="*{cpf}" placeholder="000.000.000-00" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">Telefone</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                        <input type="text" class="form-control" th:field="*{phone}" placeholder="(00) 00000-0000" required>
                                    </div>
                                </div>

                                <div class="col-12 mb-3">
                                    <label class="form-label fw-bold">E-mail</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" th:field="*{email}" required>
                                    </div>
                                </div>

                                <div class="col-12 mb-4">
                                    <label class="form-label fw-bold">Descrição / Observações</label>
                                    <textarea class="form-control" th:field="*{description}" rows="4" placeholder="Notas sobre o cliente..."></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between border-top pt-3">
                                <a th:href="@{/customers}" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-left"></i> Voltar para Lista
                                </a>
                                <button type="submit" class="btn btn-primary px-5">
                                    <i class="bi bi-check-lg me-1"></i> Salvar Alterações
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div class="text-center mt-3 text-muted">
                    <small>Cliente cadastrado em: <span th:text="${#temporals.format(customer.created_at, 'dd/MM/yyyy HH:mm')}">--/--/----</span></small>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
